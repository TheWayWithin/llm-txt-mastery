    <!-- Inter (self-hosted variable font, latin subset, LTM-ISS-13).
         Replaces render-blocking fonts.googleapis.com CSS + fonts.gstatic.com origin:
         same-origin preload + inline @font-face means zero extra origins before paint,
         and font-display: swap keeps text visible on the fallback stack meanwhile. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-var-latin.woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('/fonts/inter-var-latin.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Metric-adjusted fallback so the Arial->Inter swap is (near) shift-free:
         without this, font-display: swap re-lays-out the page and craters CLS. */
      @font-face {
        font-family: 'Inter Fallback';
        src: local('Arial');
        size-adjust: 107.4%;
        ascent-override: 90.2%;
        descent-override: 22.48%;
        line-gap-override: 0%;
      }
    </style>

    <!-- Favicon and Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/logo-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/logo-icon.png" />

    <!-- GDPR consent managed natively via consent-init.ts (no external dependency) -->

    <!-- Meta Tags -->
    <title>LLM.txt Mastery - AI-Ready Website Content Generator</title>
    <meta
      name="description"
      content="Generate, validate, and deploy llms.txt files. The only generator with all three formats — standard, full, and mini — plus A/B/C/D compliance grading. Free analysis available."
    />
    <meta
      name="keywords"
      content="LLM.txt, AI content, website analysis, artificial intelligence, OpenAI, Claude, content optimization"
    />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="LLM.txt Mastery - AI-Ready Website Content Generator" />
    <meta
      property="og:description"
      content="Generate, validate, and deploy llms.txt files. The only generator with all three formats — standard, full, and mini — plus A/B/C/D compliance grading. Free analysis available."
    />
    <meta property="og:image" content="/images/logo-primary.png" />
    <meta property="og:url" content="https://llmtxtmastery.com/" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LLM.txt Mastery - AI-Ready Website Content Generator" />
    <meta
      name="twitter:description"
      content="Generate, validate, and deploy llms.txt files. The only generator with all three formats — standard, full, and mini — plus A/B/C/D compliance grading. Free analysis available."
    />
    <meta name="twitter:image" content="/images/logo-primary.png" />

    <!-- LLM-readable content discovery -->
    <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM-readable version" />

    <!-- Additional SEO -->
    <meta name="author" content="LLM.txt Mastery" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://llmtxtmastery.com/" />

    <!-- Preload critical images for LCP optimization -->

      rel="preload"
      as="image"
      href="/images/optimized/hero-illustration-professional.avif"
      type="image/avif"
      imagesrcset="/images/optimized/hero-illustration-professional-sm.avif 400w, /images/optimized/hero-illustration-professional-md.avif 800w, /images/optimized/hero-illustration-professional.avif 1200w"
      imagesizes="(max-width: 768px) 100vw, (max-width: 1200px) 80vw, 1200px"
    />

    <!-- Plausible Analytics -->
    <script async src="https://plausible.io/js/pa-BYaFaFFyEpJHT7e8URZAx.js"></script>
    <script>
