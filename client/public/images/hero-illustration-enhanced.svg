<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc"/>
  
  <!-- Left Side - BEFORE (Invisible) -->
  <g id="before-section">
    <!-- Background -->
    <rect x="0" y="0" width="380" height="400" fill="#e2e8f0"/>
    
    <!-- Website Icon (grayed out and larger) -->
    <rect x="60" y="140" width="100" height="80" rx="12" fill="#94a3b8" stroke="#64748b" stroke-width="3"/>
    <rect x="75" y="155" width="70" height="12" fill="#64748b"/>
    <rect x="75" y="175" width="50" height="8" fill="#64748b"/>
    <rect x="75" y="190" width="60" height="8" fill="#64748b"/>
    
    <!-- AI Logos looking away (larger and more spaced) -->
    <g id="ai-logos-away">
      <!-- ChatGPT -->
      <circle cx="50" cy="250" r="25" fill="#6b7280"/>
      <text x="50" y="258" text-anchor="middle" fill="white" font-size="14" font-weight="bold">GPT</text>
      <text x="25" y="285" font-size="14" fill="#6b7280" font-weight="500">ChatGPT</text>
      
      <!-- Claude -->
      <circle cx="130" cy="310" r="25" fill="#6b7280"/>
      <text x="130" y="318" text-anchor="middle" fill="white" font-size="14" font-weight="bold">C</text>
      <text x="105" y="345" font-size="14" fill="#6b7280" font-weight="500">Claude</text>
      
      <!-- Perplexity -->
      <circle cx="220" cy="280" r="25" fill="#6b7280"/>
      <text x="220" y="288" text-anchor="middle" fill="white" font-size="14" font-weight="bold">P</text>
      <text x="185" y="315" font-size="14" fill="#6b7280" font-weight="500">Perplexity</text>
      
      <!-- Larger X marks showing they don't see the website -->
      <g stroke="#ef4444" stroke-width="4">
        <path d="M 170 200 L 185 215 M 185 200 L 170 215"/>
        <path d="M 250 220 L 265 235 M 265 220 L 250 235"/>
        <path d="M 300 260 L 315 275 M 315 260 L 300 275"/>
      </g>
    </g>
    
    <!-- "INVISIBLE TO AI" text (larger) -->
    <text x="190" y="80" text-anchor="middle" font-size="28" font-weight="bold" fill="#64748b">INVISIBLE</text>
    <text x="190" y="115" text-anchor="middle" font-size="28" font-weight="bold" fill="#64748b">TO AI</text>
  </g>
  
  <!-- Center Bridge - LLM.txt connector (enhanced) -->
  <g id="center-bridge">
    <!-- Divider line -->
    <line x1="400" y1="0" x2="400" y2="400" stroke="#d1d5db" stroke-width="3"/>
    
    <!-- LLM.txt file bridge (larger and more prominent) -->
    <rect x="340" y="170" width="120" height="60" rx="8" fill="#f97316" stroke="#ea580c" stroke-width="3"/>
    <text x="400" y="190" text-anchor="middle" font-size="14" font-weight="bold" fill="white">LLM.txt</text>
    <text x="400" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="white">BRIDGE</text>
    
    <!-- Larger transformation arrows -->
    <path d="M 320 200 L 360 200" stroke="#f97316" stroke-width="4" marker-end="url(#arrowhead)"/>
    <path d="M 440 200 L 480 200" stroke="#f97316" stroke-width="4" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Right Side - AFTER (Discovered) -->
  <g id="after-section">
    <!-- Background gradient -->
    <defs>
      <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#dcfce7"/>
        <stop offset="100%" style="stop-color:#bbf7d0"/>
      </linearGradient>
    </defs>
    <rect x="420" y="0" width="380" height="400" fill="url(#greenGradient)"/>
    
    <!-- Website Icon (highlighted and larger) -->
    <rect x="640" y="140" width="100" height="80" rx="12" fill="#10b981" stroke="#059669" stroke-width="4"/>
    <rect x="655" y="155" width="70" height="12" fill="#047857"/>
    <rect x="655" y="175" width="50" height="8" fill="#047857"/>
    <rect x="655" y="190" width="60" height="8" fill="#047857"/>
    
    <!-- Enhanced glow effect around website -->
    <circle cx="690" cy="180" r="80" fill="none" stroke="#10b981" stroke-width="3" opacity="0.4"/>
    <circle cx="690" cy="180" r="60" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6"/>
    
    <!-- AI Logos pointing toward website (larger and better positioned) -->
    <g id="ai-logos-pointing">
      <!-- ChatGPT -->
      <circle cx="530" cy="250" r="25" fill="#10b981"/>
      <text x="530" y="258" text-anchor="middle" fill="white" font-size="14" font-weight="bold">GPT</text>
      <text x="505" y="285" font-size="14" fill="#047857" font-weight="500">ChatGPT</text>
      
      <!-- Claude -->
      <circle cx="610" cy="320" r="25" fill="#10b981"/>
      <text x="610" y="328" text-anchor="middle" fill="white" font-size="14" font-weight="bold">C</text>
      <text x="585" y="355" font-size="14" fill="#047857" font-weight="500">Claude</text>
      
      <!-- Perplexity -->
      <circle cx="740" cy="280" r="25" fill="#10b981"/>
      <text x="740" y="288" text-anchor="middle" fill="white" font-size="14" font-weight="bold">P</text>
      <text x="705" y="315" font-size="14" fill="#047857" font-weight="500">Perplexity</text>
      
      <!-- Enhanced arrows pointing to website -->
      <path d="M 555 240 L 620 160" stroke="#10b981" stroke-width="4" marker-end="url(#arrowhead-green)"/>
      <path d="M 630 310 L 670 200" stroke="#10b981" stroke-width="4" marker-end="url(#arrowhead-green)"/>
      <path d="M 720 270 L 690 200" stroke="#10b981" stroke-width="4" marker-end="url(#arrowhead-green)"/>
      
      <!-- Larger checkmarks showing discovery -->
      <g stroke="#10b981" stroke-width="4" fill="none">
        <path d="M 570 200 L 578 208 L 595 190"/>
        <path d="M 630 240 L 638 248 L 655 230"/>
        <path d="M 720 230 L 728 238 L 745 220"/>
      </g>
    </g>
    
    <!-- "DISCOVERED BY AI" text (larger) -->
    <text x="610" y="80" text-anchor="middle" font-size="28" font-weight="bold" fill="#047857">DISCOVERED</text>
    <text x="610" y="115" text-anchor="middle" font-size="28" font-weight="bold" fill="#047857">BY AI</text>
  </g>
  
  <!-- Top banner with statistics (larger and more prominent) -->
  <rect x="200" y="15" width="400" height="50" rx="25" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="white">🚀 73% MORE AI CITATIONS</text>
  <text x="400" y="55" text-anchor="middle" font-size="14" fill="white">Get Found in 24 Hours, Not 24 Months</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#f97316"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#10b981"/>
    </marker>
  </defs>
</svg>