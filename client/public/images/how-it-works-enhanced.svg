<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="320" fill="#f8fafc"/>
  
  <!-- Title (larger and more prominent) -->
  <text x="400" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">PROCESS COMPARISON</text>
  
  <!-- Competitors Section (Top) -->
  <g id="competitors-section">
    <!-- Background -->
    <rect x="40" y="60" width="720" height="100" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="3"/>
    
    <!-- Label -->
    <text x="60" y="85" font-size="18" font-weight="bold" fill="#dc2626">Other Generators:</text>
    
    <!-- Step 1: Basic Scraping -->
    <g id="basic-scraping">
      <rect x="120" y="100" width="80" height="50" rx="6" fill="#9ca3af" stroke="#6b7280" stroke-width="2"/>
      <text x="160" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Basic</text>
      <text x="160" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Scraping</text>
      <text x="160" y="170" text-anchor="middle" font-size="14" fill="#6b7280" font-weight="500">Simple Crawl</text>
    </g>
    
    <!-- Arrow 1 -->
    <path d="M 210 125 L 250 125" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrow-gray)"/>
    
    <!-- Step 2: Limited Pages -->
    <g id="limited-pages">
      <rect x="260" y="100" width="80" height="50" rx="6" fill="#9ca3af" stroke="#6b7280" stroke-width="2"/>
      <text x="300" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="white">20</text>
      <text x="300" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="white">pages</text>
      <text x="300" y="170" text-anchor="middle" font-size="14" fill="#6b7280" font-weight="500">Limited Discovery</text>
    </g>
    
    <!-- Arrow 2 -->
    <path d="M 350 125 L 390 125" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrow-gray)"/>
    
    <!-- Step 3: Basic Output -->
    <g id="basic-output">
      <rect x="400" y="100" width="80" height="50" rx="6" fill="#9ca3af" stroke="#6b7280" stroke-width="2"/>
      <text x="440" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Basic</text>
      <text x="440" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="white">LLM.txt</text>
      <text x="440" y="170" text-anchor="middle" font-size="14" fill="#6b7280" font-weight="500">Generic Output</text>
    </g>
    
    <!-- Problems indicators (larger and clearer) -->
    <text x="520" y="115" font-size="14" fill="#ef4444" font-weight="600">❌ Misses content</text>
    <text x="520" y="135" font-size="14" fill="#ef4444" font-weight="600">❌ No AI scoring</text>
  </g>
  
  <!-- LLM.txt Mastery Section (Bottom) -->
  <g id="mastery-section">
    <!-- Background -->
    <rect x="40" y="180" width="720" height="100" rx="12" fill="#dcfce7" stroke="#10b981" stroke-width="3"/>
    
    <!-- Label -->
    <text x="60" y="205" font-size="18" font-weight="bold" fill="#047857">LLM.txt Mastery:</text>
    
    <!-- Step 1: AI Analysis -->
    <g id="ai-analysis">
      <rect x="120" y="220" width="80" height="50" rx="6" fill="#10b981" stroke="#059669" stroke-width="2"/>
      <text x="160" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🧠 AI</text>
      <text x="160" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Analysis</text>
      <text x="160" y="255" text-anchor="middle" font-size="12" fill="white">⭐⭐⭐</text>
      <text x="160" y="290" text-anchor="middle" font-size="14" fill="#047857" font-weight="500">Smart Discovery</text>
    </g>
    
    <!-- Arrow 1 -->
    <path d="M 210 245 L 250 245" stroke="#10b981" stroke-width="4" marker-end="url(#arrow-green)"/>
    
    <!-- Step 2: Comprehensive Pages -->
    <g id="comprehensive-pages">
      <rect x="260" y="220" width="80" height="50" rx="6" fill="#10b981" stroke="#059669" stroke-width="2"/>
      <text x="300" y="235" text-anchor="middle" font-size="20" font-weight="bold" fill="white">200+</text>
      <text x="300" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="white">pages</text>
      <text x="300" y="255" text-anchor="middle" font-size="12" fill="white">✨ Quality</text>
      <text x="300" y="290" text-anchor="middle" font-size="14" fill="#047857" font-weight="500">10x More Content</text>
    </g>
    
    <!-- Arrow 2 -->
    <path d="M 350 245 L 390 245" stroke="#10b981" stroke-width="4" marker-end="url(#arrow-green)"/>
    
    <!-- Step 3: Optimized Output -->
    <g id="optimized-output">
      <rect x="400" y="220" width="80" height="50" rx="6" fill="#10b981" stroke="#059669" stroke-width="2"/>
      <text x="440" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🚀 Optimized</text>
      <text x="440" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="white">LLM.txt</text>
      <text x="440" y="255" text-anchor="middle" font-size="12" fill="white">✅ Verified</text>
      <text x="440" y="290" text-anchor="middle" font-size="14" fill="#047857" font-weight="500">AI-Enhanced</text>
    </g>
    
    <!-- Benefits indicators (larger and clearer) -->
    <text x="520" y="235" font-size="14" fill="#10b981" font-weight="600">✅ Finds hidden gems</text>
    <text x="520" y="250" font-size="14" fill="#10b981" font-weight="600">✅ Quality scoring</text>
    <text x="520" y="265" font-size="14" fill="#10b981" font-weight="600">✅ 73% more citations</text>
  </g>
  
  <!-- Statistics comparison in center (enhanced) -->
  <g id="stats-comparison">
    <!-- Competitors stats -->
    <rect x="600" y="95" width="140" height="60" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="670" y="115" text-anchor="middle" font-size="16" font-weight="bold" fill="#dc2626">Competitors</text>
    <text x="670" y="132" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="500">20 pages found</text>
    <text x="670" y="147" text-anchor="middle" font-size="13" fill="#dc2626" font-weight="500">Basic quality</text>
    
    <!-- Our stats -->
    <rect x="600" y="215" width="140" height="60" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="3"/>
    <text x="670" y="235" text-anchor="middle" font-size="16" font-weight="bold" fill="#16a34a">LLM.txt Mastery</text>
    <text x="670" y="252" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="500">200+ pages found</text>
    <text x="670" y="267" text-anchor="middle" font-size="13" fill="#16a34a" font-weight="500">AI-optimized quality</text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#9ca3af"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#10b981"/>
    </marker>
  </defs>
</svg>