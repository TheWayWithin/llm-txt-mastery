executive_summary:
  critical_issues: 4
  conversion_blockers: 3
  emotional_friction_points: 7
  estimated_conversion_loss: "45-60%"
  priority_fixes_required: 5
  implementation_complexity: "Medium"
  estimated_improvement: "2.5-3x conversion rate"

heuristic_evaluation:
  visibility_of_system_status:
    score: 3/10
    violations:
      - "No clear indication of authentication state during flow"
      - "User location in journey unclear (scrolling past sections)"
      - "Mixed states: landing page content visible during analysis"
    recommendations:
      - "Implement clear step indicators with authentication state"
      - "Separate landing from application screens"
      - "Add persistent progress breadcrumb"

  match_between_system_and_real_world:
    score: 4/10
    violations:
      - "'Login Instead' button appears AFTER email entry field"
      - "Sign-up vs Sign-in conceptually confused"
      - "Tier selection defaults to FREE when paid is expected"
    recommendations:
      - "Use conventional auth patterns: Login | Sign Up buttons"
      - "Default to value tier (Solopreneur) for new users"
      - "Match mental model: choose tier → authenticate → analyze"

  user_control_and_freedom:
    score: 2/10
    violations:
      - "No clear escape hatch from email capture"
      - "Cannot easily switch between login and signup"
      - "Forced to scroll through landing content"
    recommendations:
      - "Add clear back/cancel options at each step"
      - "Implement dedicated auth pages with easy switching"
      - "Allow direct navigation to key actions"

  consistency_and_standards:
    score: 3/10
    violations:
      - "Authentication flow differs from industry standards"
      - "Mixed modal and inline authentication"
      - "Inconsistent CTA positioning"
    recommendations:
      - "Adopt standard SaaS authentication patterns"
      - "Use consistent modal or page-based auth"
      - "Standardize primary action placement"

  error_prevention:
    score: 5/10
    violations:
      - "Email field appears before user chooses login vs signup"
      - "No password confirmation for new users"
      - "Tier selection can be accidentally changed"
    recommendations:
      - "Separate signup and login flows completely"
      - "Add password confirmation field"
      - "Lock tier selection after choice"

  recognition_rather_than_recall:
    score: 4/10
    violations:
      - "User must remember if they have account"
      - "Selected tier not visually persistent"
      - "No indication of previous choices"
    recommendations:
      - "Show selected tier prominently"
      - "Add 'Remember me' functionality"
      - "Display user email after authentication"

  flexibility_and_efficiency:
    score: 2/10
    violations:
      - "No shortcuts for returning users"
      - "Must scroll through entire landing page"
      - "Cannot skip to analysis for authenticated users"
    recommendations:
      - "Add 'Start Analysis' for authenticated users"
      - "Implement keyboard shortcuts"
      - "Create dedicated analysis page"

  aesthetic_and_minimalist_design:
    score: 6/10
    positive:
      - "Clean visual hierarchy"
      - "Good use of whitespace"
    violations:
      - "Landing page content mixed with application flow"
      - "Too much information during critical conversion steps"
    recommendations:
      - "Separate marketing from application interface"
      - "Progressive disclosure of information"

  help_users_recognize_diagnose_recover:
    score: 7/10
    positive:
      - "Error messages are contextual"
      - "Recovery options provided"
    violations:
      - "Authentication errors not clearly differentiated"
    recommendations:
      - "Specific error messages for login vs signup failures"
      - "Clear next steps for each error type"

  help_and_documentation:
    score: 8/10
    positive:
      - "QuickHelp system implemented"
      - "Contextual help available"
    recommendations:
      - "Add onboarding flow for new users"
      - "Include video walkthrough option"

