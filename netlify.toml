[build]
  # build:prerender = vite build + headless snapshot of the marketing routes
  # (LTM-ISS-9); chromium is installed first for playwright
  command = "npx playwright install chromium && npm run build:prerender"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SEO infrastructure files - force serve before SPA fallback
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/llms.txt"
  to = "/llms.txt"
  status = 200
  force = true

# SPA fallback (must be last). Targets the pristine app shell: the root
# index.html is the PRERENDERED homepage (LTM-ISS-9), and app routes
# (/analyze, /login, ...) must not flash homepage copy before React mounts.
# Netlify serves real files (the prerendered marketing pages) before this
# non-forced redirect applies.
[[redirects]]
  from = "/*"
  to = "/app-shell/index.html"
  status = 200